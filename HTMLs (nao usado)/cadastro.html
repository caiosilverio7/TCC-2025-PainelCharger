<!DOCTYPE html>
<html lang="pt-br">
<head>
  
<link rel="stylesheet" href="cadastro.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Carregador Solar</title>
    <link rel="stylesheet" href="estilos.css"> <!-- O CSS não será alterado -->
</head>
<body> 

    <div class="cadastro-container">
<form action="cadastro.php" method="POST">
    <h2>Cadastro</h2>
    
    <div class="input-field">
        <input type="text" name="nome" placeholder="Nome" required>
    </div>

    <div class="input-field">
        <input type="email" name="email" placeholder="Email" required>
    </div>
    

    <input type="text" name="cpf" id="cpf" maxlength="14" oninput="mascaraCPF(this)" placeholder="CPF">

<script>
function mascaraCPF(campo) {
  let v = campo.value.replace(/\D/g, ""); // só números
  v = v.replace(/(\d{3})(\d)/, "$1.$2");  // coloca o 1º ponto
  v = v.replace(/(\d{3})(\d)/, "$1.$2");  // coloca o 2º ponto
  v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2"); // coloca o traço
  campo.value = v;
}
</script>
    
    <div class="input-field">
        <input type="password" name="senha" placeholder="Senha" required>
    </div>

    <div class="btn-field">
        <button type="submit">Cadastrar</button>
    </div>

    <p><a href="login.php">Já tem conta? Faça login aqui.</a></p>
</form>

    </div>
</body>
</html>
